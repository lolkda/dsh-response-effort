name: Publish npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'lolkda/dsh-response-effort'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      NPM_CONFIG_PROVENANCE: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Install OIDC-capable npm
        run: npm install --global npm@11.19.0 --ignore-scripts --no-audit --no-fund
      - name: Validate release context
        run: node scripts/verify-release.mjs context
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck, build, test and verify notes
        run: npm run check
      - name: Pack and inspect the exact release artifact
        run: |
          npm pack --ignore-scripts --json > "$RUNNER_TEMP/npm-pack.json"
          node scripts/verify-release.mjs pack "$RUNNER_TEMP/npm-pack.json"
      - name: Publish with OIDC
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          artifact=$(node -p '`${require("./package.json").name}-${require("./package.json").version}.tgz`')
          npm publish "./$artifact" --access public --registry=https://registry.npmjs.org/ --ignore-scripts --provenance=false
